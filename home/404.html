<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found</title>
<style>
:root{--bg:#f7f8fb;--ink:#14171f;--mute:#5b6372;--accent:#4f46e5}
@media (prefers-color-scheme:dark){:root{--bg:#0d1017;--ink:#e8ebf2;--mute:#9aa3b5;--accent:#8b85ff}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px;text-align:center}
a{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<div><h1>Page not found</h1><p style="color:var(--mute)">That page doesn't exist.</p><p><a id="home" href="/">← Back to all tracks</a></p></div>
<script>
// Project pages live under /<repo>/; send people to that root, not the domain root.
(function(){var p=location.pathname.split('/').filter(Boolean);if(location.hostname.endsWith('github.io')&&p.length)document.getElementById('home').href='/'+p[0]+'/';})();
</script>
</body>
</html>
