name: Deploy Pages

# Assembles one site from every track folder (copied as-is), builds the
# global search index and adds the "All tracks + Search" widget to each page.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Headless Chromium renders each page so the search index includes JS-built content
      - name: Install Playwright
        run: |
          npm install --no-save --prefix tools/site playwright@1.63.0
          npx --prefix tools/site playwright install --with-deps chromium

      - name: Build site (copy tracks, build search index, add global nav)
        run: node tools/site/build.cjs _site

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
