name: Deploy Pages

# Assembles one site from every track folder. Each track is copied as-is.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -a home/.            _site/
          cp -a docs              _site/sql-atlas
          cp -a cb-ml             _site/cb-ml
          cp -a cb-ml-transformers _site/cb-ml-transformers
          cp -a cb-sys-design/docs _site/cb-sys-design
          cp -a dsa-interview     _site/dsa-interview
          rm -rf _site/*/.github
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
