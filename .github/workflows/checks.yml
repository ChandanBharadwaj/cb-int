name: Checks

# Runs the Interview Atlas checks that used to be run by hand:
#  - every runnable puzzle must print its expected output
#  - every topic page must load with no errors, all sections, and no sideways scroll on a phone
# Separate from "Deploy Pages", so a failure here shows up without blocking a deploy.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  puzzles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run every runnable puzzle (Java, Python, Node.js, TypeScript)
        run: node tools/verify_puzzles.cjs

  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Check every Atlas topic page
        run: node tools/check_topic.cjs all
